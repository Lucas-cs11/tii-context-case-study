name: context-g2-g4
on: workflow_dispatch
permissions:
  contents: read
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
      - run: python scripts/download_context.py
      - run: python scripts/g2_g4_analysis.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2-g4-${{ github.run_id }}
          path: results/
