name: context-audit
on: workflow_dispatch
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
      - run: python scripts/download_context.py
      - run: python scripts/inventory_csv.py
      - run: python scripts/opcua_inventory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: context-audit-${{ github.run_id }}
          path: results/
